
<!DOCTYPE html>

  <head>
    <meta charset="utf-8" />

    <title>Aura Twin</title>
    <link rel="icon" type="image/svg+xml" href="/public/icon.svg" />
    <link rel="manifest" href="/public/manifest.json" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              coral: {
                DEFAULT: '#FF6B6B', // Updated to catchy warm red
                light: '#FFF0F0',   
                dark: '#EE5253',
              },
              sage: {
                 DEFAULT: '#2ED573', 
                 light: '#DCFCE7',
                 dark: '#26AF61',
              },
              gold: {
                DEFAULT: '#FFA502', // Warm Gold
              },
              warm: {
                white: '#FFF9F5',   // Updated background warm tint
                gray: '#F2EAE0',
                dark: '#DCD6CC',
              },
              text: {
                main: '#2D3436', 
                sec: '#636E72',
                muted: '#B2BEC3',
              },
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            },
            boxShadow: {
              'soft': '0 10px 40px -10px rgba(255, 107, 107, 0.15)',
              'glow': '0 0 25px rgba(255, 107, 107, 0.3)',
              'float': '0 10px 30px -5px rgba(0,0,0,0.08)',
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            }
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body { 
        font-family: 'Plus Jakarta Sans', sans-serif; 
        -webkit-tap-highlight-color: transparent; 
        background-color: #FFF9F5; 
        color: #2D3436; 
      }
      img { transition: opacity 0.3s ease-in-out; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
